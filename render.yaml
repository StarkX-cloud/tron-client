services:
  - type: web
    name: tron-master
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python queue_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: TRON_HOST
        value: 0.0.0.0
      - key: TRON_RELOAD
        value: false
      - key: TRON_TRAINING_AUTH_TOKEN
        sync: false  # set in the Render dashboard, not committed — required
                     # to lock down /training/session*; unset = open (dev default)
      - key: TRON_ARTIFACT_ENCRYPTION_KEY
        sync: false  # set in the Render dashboard, not committed — a Fernet
                     # key (generate: python -c "from cryptography.fernet
                     # import Fernet; print(Fernet.generate_key().decode())")
                     # encrypting every artifact at rest; unset = plaintext
                     # on disk (dev default)
