services:
  - type: web
    name: tron-master
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python queue_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: TRON_HOST
        value: 0.0.0.0
      - key: TRON_RELOAD
        value: false
      - key: TRON_TRAINING_AUTH_TOKEN
        sync: false  # set in the Render dashboard, not committed — required
                     # to lock down /training/session*; unset = open (dev default)
